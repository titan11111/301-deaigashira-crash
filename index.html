<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[(Math.random()*a.length)|0];
const DEG=180/Math.PI;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

if(!window.THREE){document.getElementById('overlay').innerHTML='<div class="panel">3Dエンジンの読み込みに失敗しました。通信状態を確認して再読み込みしてください。</div>';return;}

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});}
catch(e){$('overlay').innerHTML='<div class="panel">この端末ではWebGLが使えないため遊べません。</div>';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfe3ff);
scene.fog=new THREE.Fog(0xd8ebf6,34,125);
const camera=new THREE.PerspectiveCamera(60,1,0.1,400);
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?74:58;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

// ---------- lights
const hemi=new THREE.HemisphereLight(0xe3f3ff,0x8c7c62,0.78);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d6,1.3);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:100});
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;
scene.add(sun);scene.add(sun.target);

// ---------- helpers
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o||{}));
function box(w,h,d,mat,x,y,z,parent,noShadow){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=!noShadow;m.receiveShadow=true;(parent||scene).add(m);return m;}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function asphalt(rx,ry){const t=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#4b4e54';g.fillRect(0,0,w,h);for(let i=0;i<6000;i++){const v=(58+Math.random()*55)|0;g.fillStyle='rgba('+v+','+v+','+(v+4)+',.55)';g.fillRect(Math.random()*w,Math.random()*h,1.6,1.6);}});t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;}
function inRoad(x,z,h){return Math.abs(x)<=h||Math.abs(z)<=h;}
function clampRoad(p,prev,h){
  if(inRoad(p.x,p.z,h))return '';
  let ax;
  if(Math.abs(prev.x)<=h){p.x=clamp(p.x,-h,h);ax='x';}else{p.z=clamp(p.z,-h,h);ax='z';}
  if(!inRoad(p.x,p.z,h)){p.x=clamp(p.x,-h,h);ax='x';}
  return ax;
}
const obstacles=[],houses=[];

// ---------- ground & roads
const ground=new THREE.Mesh(new THREE.PlaneGeometry(420,420),M(0xa9a394));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
box(6.4,0.04,300,M(0xffffff,{map:asphalt(1.6,72),roughness:.95}),0,0.02,0,null,true);
box(300,0.04,6.4,M(0xffffff,{map:asphalt(72,1.6),roughness:.95}),0,0.021,0,null,true);
const lineMat=M(0xf4f4f0,{roughness:.6});
for(const s of [-1,1]){
  for(const e of [-1,1]){
    box(0.12,0.05,146.8,lineMat,s*2.95,0.03,e*(3.2+73.4),null,true);
    box(146.8,0.05,0.12,lineMat,e*(3.2+73.4),0.03,s*2.95,null,true);
  }
}
box(5.6,0.05,0.4,lineMat,0,0.035,-3.9,null,true);
box(0.4,0.05,5.6,lineMat,3.9,0.035,0,null,true);
{ // road text
  const t=canvasTex(128,384,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.93)';g.font='bold 118px "Hiragino Sans","Yu Gothic",sans-serif';g.textAlign='center';g.textBaseline='middle';['止','ま','れ'].forEach((ch,i)=>g.fillText(ch,w/2,64+i*128));});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(2.2,6),new THREE.MeshStandardMaterial({map:t,transparent:true,depthWrite:false,roughness:.7,polygonOffset:true,polygonOffsetFactor:-2}));
  m.rotation.set(-Math.PI/2,0,Math.PI);m.position.set(0,0.05,-8.6);m.receiveShadow=true;scene.add(m);
}

// ---------- blocks, walls, houses
const blockTex=canvasTex(128,64,(g,w,h)=>{g.fillStyle='#bdb7aa';g.fillRect(0,0,w,h);for(let i=0;i<1600;i++){const v=(150+Math.random()*60)|0;g.fillStyle='rgba('+v+','+(v-4)+','+(v-12)+',.5)';g.fillRect(Math.random()*w,Math.random()*h,1,1);}
  g.strokeStyle='#8c8679';g.lineWidth=2;g.beginPath();g.moveTo(0,1);g.lineTo(w,1);g.moveTo(0,h/2);g.lineTo(w,h/2);g.moveTo(1,0);g.lineTo(1,h/2);g.moveTo(w/2,0);g.lineTo(w/2,h/2);g.moveTo(w/4,h/2);g.lineTo(w/4,h);g.moveTo(w*3/4,h/2);g.lineTo(w*3/4,h);g.stroke();});
blockTex.wrapS=blockTex.wrapT=THREE.RepeatWrapping;blockTex.repeat.set(56.6/0.8,1.8/0.4);
const wallMat=M(0xffffff,{map:blockTex,roughness:.95});
const capMat=M(0x8f8a80);
const grassMat=M(0x86a36b,{roughness:1});
const houseColors=[0xf3efe6,0xe9dccb,0xdfe6ea,0xf6e7d8,0xd9d2c5,0xece4f0,0xf1e1c6];
const roofColors=[0x4b5563,0x7a3b2e,0x355070,0x5b4a3f,0x6b705c,0x2f3e46];
const glass=M(0x2d4a63,{roughness:.15,metalness:.35});
function house(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const w=rand(6,7.6),d=rand(6,7.6),h=rand(4.8,5.9);houses.push({x,z,hw:w/2,hd:d/2,h:h+1.5});
  box(w,h,d,M(pick(houseColors)),0,h/2,0,g);
  const r=Math.max(w,d);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(r*0.78,2.3,4),M(pick(roofColors),{roughness:.65}));
  roof.position.y=h+1.15;roof.rotation.y=Math.PI/4;roof.scale.set(w/r,1,d/r);roof.castShadow=true;g.add(roof);
  for(const fl of [1.6,3.9]){
    box(1.2,1.0,0.08,glass,rand(-1,1)*w*0.2,fl,d/2+0.02,g,true);
    box(1.2,1.0,0.08,glass,rand(-1,1)*w*0.2,fl,-d/2-0.02,g,true);
    box(0.08,1.0,1.2,glass,w/2+0.02,fl,rand(-1,1)*d*0.2,g,true);
    box(0.08,1.0,1.2,glass,-w/2-0.02,fl,rand(-1,1)*d*0.2,g,true);
  }
}
function sakura(x,z,s){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.16*s,0.28*s,2.8*s,8),M(0x5a4033));tr.position.y=1.4*s;tr.castShadow=true;g.add(tr);
  const pink=[0xffc2d4,0xffd3e0,0xffb3c9];
  for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(rand(1.1,1.7)*s,1),M(pick(pink),{flatShading:true,roughness:.9}));m.position.set(rand(-1.5,1.5)*s,rand(3,4.4)*s,rand(-1.5,1.5)*s);m.castShadow=true;g.add(m);}
}
for(const sx of [-1,1])for(const sz of [-1,1]){
  box(56.4,0.06,56.4,grassMat,sx*31.8,0.03,sz*31.8,null,true);
  box(56.6,1.8,0.18,wallMat,sx*(3.4+28.3),0.9,sz*3.4);
  box(0.18,1.8,56.6,wallMat,sx*3.4,0.9,sz*(3.4+28.3));
  box(56.8,0.08,0.28,capMat,sx*(3.4+28.3),1.84,sz*3.4,null,true);
  box(0.28,0.08,56.8,capMat,sx*3.4,1.84,sz*(3.4+28.3),null,true);
  for(let k=0;k<4;k++){house(sx*(9.6+k*12.5),sz*9.6);if(k>0)house(sx*9.6,sz*(9.6+k*12.5));}
  house(sx*22.5,sz*22.5);
}
sakura(6.2,-6.2,1.05);sakura(-6.4,6.6,0.95);sakura(-6.6,-16,1);sakura(16,6.4,1.1);sakura(-17,-6.3,0.9);sakura(6.3,-22,0.95);

// poles & wires
const poleMat=M(0x9c998f);
function pole(x,z,dyn){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const p=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.18,9,10),poleMat);p.position.y=4.5;p.castShadow=true;g.add(p);box(1.3,0.1,0.1,poleMat,0,8.3,0,g,true);const ob={x,z,r:0.18,h:9,name:'電柱',mesh:g,active:true,wob:0,dyn:!!dyn};obstacles.push(ob);return ob;}
const wireMat=new THREE.LineBasicMaterial({color:0x2a2a2a});
function wire(a,b){const pts=[];for(let i=0;i<=12;i++){const t=i/12;pts.push(new THREE.Vector3(lerp(a.x,b.x,t),8.25-Math.sin(t*Math.PI)*0.5,lerp(a.z,b.z,t)));}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),wireMat));}
let prevP=null;
for(let z=-66;z<=66;z+=18){if(Math.abs(z)<5)continue;pole(-3.05,z);const cur=V(-3.05,0,z);if(prevP)wire(prevP,cur);prevP=cur;}
prevP=null;
for(let x=-66;x<=66;x+=18){if(Math.abs(x)<5)continue;pole(x,3.05);const cur=V(x,0,3.05);if(prevP)wire(prevP,cur);prevP=cur;}

// vending machine
{const g=new THREE.Group();g.position.set(-3.0,0,-12);scene.add(g);
 box(0.7,1.85,1.0,M(0xd7263d,{roughness:.4}),0,0.925,0,g);
 const lit=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.9,0.86),new THREE.MeshStandardMaterial({color:0xfff6e6,emissive:0xfff0d0,emissiveIntensity:.55}));lit.position.set(0.36,1.3,0);g.add(lit);
 const cans=[0x1f6fd1,0xf2b705,0x2aa84a,0xe8475f,0xffffff,0x7b4fd0];
 for(let r=0;r<2;r++)for(let i=0;i<5;i++)box(0.02,0.18,0.1,M(pick(cans),{roughness:.3}),0.38,1.08+r*0.36,-0.32+i*0.16,g,true);
 box(0.04,0.18,0.5,M(0x222222),0.36,0.45,0,g,true);
 obstacles.push({x:-3.0,z:-12,r:0.5,h:1.85,name:'自販機',mesh:g,active:true,wob:0});}

// school
{const t=canvasTex(512,160,(g,w,h)=>{g.fillStyle='#f4f2ec';g.fillRect(0,0,w,h);for(let r=0;r<3;r++)for(let c=0;c<14;c++){g.fillStyle='#3d5a78';g.fillRect(14+c*35.5,18+r*48,24,28);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(14+c*35.5,18+r*48,24,5);}});
 box(52,14,12,M(0xf1efe8),0,7,84);
 const f=new THREE.Mesh(new THREE.PlaneGeometry(52,14),new THREE.MeshStandardMaterial({map:t,roughness:.9}));f.position.set(0,7,77.96);f.rotation.y=Math.PI;scene.add(f);
 box(8,7,8,M(0xf1efe8),0,17.5,84);
 const ct=canvasTex(128,128,(g)=>{g.fillStyle='#fff';g.beginPath();g.arc(64,64,58,0,7);g.fill();g.strokeStyle='#2b2140';g.lineWidth=6;g.stroke();g.lineWidth=5;g.beginPath();g.moveTo(64,64);g.lineTo(64,22);g.moveTo(64,64);g.lineTo(92,70);g.stroke();});
 const cm=new THREE.Mesh(new THREE.CircleGeometry(2.4,32),new THREE.MeshBasicMaterial({map:ct}));cm.position.set(0,18,79.95);cm.rotation.y=Math.PI;scene.add(cm);}

// ---------- realism extras
{ // gutters (側溝)
  const mk=(vert)=>{const t=canvasTex(64,64,(g,w,h)=>{g.fillStyle='#a8a69e';g.fillRect(0,0,w,h);for(let i=0;i<500;i++){const v=(140+Math.random()*50)|0;g.fillStyle='rgba('+v+','+v+','+(v-6)+',.6)';g.fillRect(Math.random()*w,Math.random()*h,1,1);}g.fillStyle='#55534e';for(let k=4;k<64;k+=8){if(vert)g.fillRect(k,14,3,36);else g.fillRect(14,k,36,3);}});t.wrapS=t.wrapT=THREE.RepeatWrapping;if(vert)t.repeat.set(146.8/0.5,1);else t.repeat.set(1,146.8/0.5);return t;};
  const mz=M(0xffffff,{map:mk(false),roughness:.95}),mx=M(0xffffff,{map:mk(true),roughness:.95});
  for(const s of [-1,1])for(const e of [-1,1]){
    box(0.42,0.05,146.8,mz,s*3.19,0.03,e*(3.4+73.4),null,true);
    box(146.8,0.05,0.42,mx,e*(3.4+73.4),0.03,s*3.19,null,true);}
}
{ // manholes
  const mt=canvasTex(128,128,(g)=>{g.fillStyle='#3c3a37';g.beginPath();g.arc(64,64,62,0,7);g.fill();g.strokeStyle='#5b5853';g.lineWidth=3;for(let r=14;r<60;r+=11){g.beginPath();g.arc(64,64,r,0,7);g.stroke();}for(let a=0;a<12;a++){g.beginPath();g.moveTo(64,64);g.lineTo(64+Math.cos(a/12*6.283)*60,64+Math.sin(a/12*6.283)*60);g.stroke();}g.strokeStyle='#2a2826';g.lineWidth=4;g.beginPath();g.arc(64,64,61,0,7);g.stroke();});
  const mm=new THREE.MeshStandardMaterial({map:mt,roughness:.6,metalness:.4,transparent:true,polygonOffset:true,polygonOffsetFactor:-2});
  [[0.6,-21],[-1.1,14],[15,0.9],[-18,-0.7]].forEach(([x,z])=>{const m=new THREE.Mesh(new THREE.CircleGeometry(0.34,32),mm);m.rotation.x=-Math.PI/2;m.position.set(x,0.047,z);m.receiveShadow=true;scene.add(m);});
}
{ // 一時停止 sign
  const st=canvasTex(256,230,(g)=>{g.fillStyle='#fff';g.beginPath();g.moveTo(8,10);g.lineTo(248,10);g.lineTo(128,222);g.closePath();g.fill();g.fillStyle='#d4252c';g.beginPath();g.moveTo(26,22);g.lineTo(230,22);g.lineTo(128,202);g.closePath();g.fill();g.fillStyle='#fff';g.font='bold 50px "Hiragino Sans","Yu Gothic",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('止まれ',128,78);});
  const gs=new THREE.Group();gs.position.set(2.85,0,-4.5);scene.add(gs);
  const pl=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,2.6,10),M(0xc9c9c4,{metalness:.5,roughness:.4}));pl.position.y=1.3;pl.castShadow=true;gs.add(pl);
  const sg=new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.72),new THREE.MeshStandardMaterial({map:st,transparent:true,roughness:.5,side:THREE.DoubleSide}));sg.position.set(0,2.35,-0.05);sg.rotation.y=Math.PI;sg.castShadow=true;gs.add(sg);
  obstacles.push({x:2.85,z:-4.5,r:0.05,h:2.6,name:'標識',mesh:gs,active:true,wob:0});
}
// sky dome
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x6fa9dd)},bot:{value:new THREE.Color(0xe4eef3)}},
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=clamp(vP.y,0.0,1.0);gl_FragColor=vec4(mix(bot,top,pow(h,0.55)),1.0);}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,32,16),skyMat);sky.renderOrder=-1;scene.add(sky);

// ---------- curve mirror

  const legs=[],arms=[];

    add(new THREE.CylinderGeometry(0.066,0.052,0.74,10),legM,p,0,-0.37,0);

  const cap=add(new THREE.SphereGeometry(0.153,20,14,0,Math.PI*2,0,Math.PI*0.58),hairM,head,0,0.012,-0.012);cap.rotation.x=-0.35;
  add(new THREE.BoxGeometry(0.2,0.05,0.05),hairM,head,0,0.088,0.115).rotation.x=0.35;
  for(const s of [-1,1]){add(new THREE.SphereGeometry(0.019,8,8),dark,head,s*0.05,0.005,0.128);
    if(o.girl)add(new THREE.SphereGeometry(0.02,8,8),M(0xff9bb0,{roughness:.9}),head,s*0.079,-0.035,0.113).scale.set(1.3,0.6,0.5);}
  const back=(h,y)=>add(new THREE.CylinderGeometry(0.135,0.15,h,14,1,true,Math.PI*0.5,Math.PI),hairM,head,0,y,-0.01);
  if(o.style==='long')back(0.36,-0.14);
  if(o.style==='short')back(0.18,-0.06);

function pose(c,ph,amp,sit,lean,lie){
  const lr=Math.sin(ph)*amp;
  c.legs[0].rotation.x=lerp(lr,-1.45,sit);c.legs[1].rotation.x=lerp(-lr,-1.45,sit);
  c.arms[0].rotation.x=lerp(-lr*0.9,0.7,sit);c.arms[1].rotation.x=lerp(lr*0.9,0.7,sit);
  c.up.rotation.x=lerp(lean,lie?-1.25:-0.42,sit);
  c.inner.position.y=lerp(Math.abs(Math.sin(ph))*0.05*amp,-0.72,sit);
}

function makeBike(){

    const t=new THREE.Mesh(new THREE.TorusGeometry(0.31,0.035,8,28),tire);t.rotation.y=Math.PI/2;t.castShadow=true;w.add(t);
    for(let i=0;i<3;i++){const sp=new THREE.Mesh(new THREE.BoxGeometry(0.01,0.6,0.01),metal);sp.rotation.x=i*Math.PI/3;w.add(sp);}wheels.push(w);}
  box(0.05,0.05,0.9,fm,0,0.72,0,g);
  box(0.05,0.05,0.75,fm,0,0.52,0.08,g).rotation.x=0.55;
  box(0.04,0.5,0.04,metal,0,0.7,-0.3,g);box(0.15,0.05,0.25,M(0x222222),0,0.96,-0.3,g);
  box(0.04,0.66,0.04,metal,0,0.66,0.48,g).rotation.x=-0.25;
  box(0.56,0.04,0.04,metal,0,1.02,0.42,g);
  box(0.34,0.22,0.26,M(0xcfd3d8,{wireframe:true}),0,0.92,0.68,g,true);

  scene.remove(rider.g);g.add(rider.g);rider.g.position.set(0,0.12,-0.28);

}

    const root=decoyRoot();
    if(decoy.mode==='cross'){const arr=Math.max(3.3,S.arrive-rand(1.4,2.3));decoy.pos.set(decoy.speed*arr,0,rand(-1.2,1.2));decoy.dir.set(-1,0,0);root.rotation.set(0,-Math.PI/2,0);}
    else{decoy.pos.set(pick([-1,1])*rand(1.1,1.8),0,48);decoy.dir.set(0,0,-1);root.rotation.set(0,Math.PI,0);}
    root.position.copy(decoy.pos);S.seen[decoy.who]=true;
  }
  T.active=false;T.caught=false;
  S.camYaw=0;S.t=0;S.simT=0;S.bubble='';S.b2=null;S.impact=false;S.scored=false;
  // recorder
  const n=[],add=c=>n.push(c.g,c.inner,c.up,c.legs[0],c.legs[1],c.arms[0],c.arms[1],c.stars);

  obstacles.forEach(o=>n.push(o.mesh));
  REC.nodes=n;REC.frames=[];
}
function record(){const n=REC.nodes,d=new Float32Array(n.length*7);
  for(let i=0;i<n.length;i++){const o=n[i],j=i*7;d[j]=o.position.x;d[j+1]=o.position.y;d[j+2]=o.position.z;d[j+3]=o.rotation.x;d[j+4]=o.rotation.y;d[j+5]=o.rotation.z;d[j+6]=o.visible?1:0;}
  REC.frames.push({t:S.simT,d,tp:REC.toasts.map(x=>x.node.parent===scene)});if(REC.frames.length>2000)REC.frames.splice(0,300);}
function applyFrame(f){REC.toasts.forEach((x,i)=>{const w=f.tp[i]?scene:x.home.parent;if(x.node.parent!==w)w.add(x.node);});
  const n=REC.nodes,d=f.d;for(let i=0;i<n.length;i++){const o=n[i],j=i*7;o.position.set(d[j],d[j+1],d[j+2]);o.rotation.set(d[j+3],d[j+4],d[j+5]);o.visible=d[j+6]>0.5;}}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,delay,slide){const a=ac();if(!a||!S.sound)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);}
function noise(d,vol,delay,freq){const a=ac();if(!a||!S.sound)return;const t=a.currentTime+(delay||0);const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||900;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);}
function chime(){[659,523,587,392,392,587,659,523].forEach((f,i)=>tone(f,0.5,'sine',0.09,i*0.32));}
function bell(){[0,0.16,0.42,0.58].forEach(d=>tone(2350,0.14,'sine',0.07,d));}
function gon(){tone(92,0.35,'sine',0.45,0,0.5);noise(0.15,0.4,0,420);S.shake=Math.max(S.shake,0.25);}
function sfxImpact(kind){noise(0.25,0.55,0,700);tone(130,0.4,'sine',0.5,0,0.4);
  if(kind==='fly'){tone(260,0.9,'triangle',0.14,0.05,5);noise(0.6,0.25,0.1,2500);}
  if(kind==='great'){tone(880,0.12,'square',0.05,0.3);tone(1320,0.18,'square',0.05,0.42);}
  if(kind==='bike'){noise(0.5,0.5,0,3000);tone(600,0.3,'square',0.06,0.05,0.5);}}

function bang(txt){const el=$('bang');el.textContent=txt;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');}
function flash(){const f=$('flash');f.style.transition='none';f.style.opacity='.85';requestAnimationFrame(()=>{f.style.transition='opacity .45s';f.style.opacity='0';});}
function heading(){return V(Math.sin(player.yaw),0,Math.cos(player.yaw));}
function beginEvent(res,contact,dur){S.res=res;S.state='after';S.afterT=0;S.afterDur=dur;S.contact.copy(contact);REC.eventT=S.simT;
  S.camAng=Math.atan2(camera.position.z-contact.z,camera.position.x-contact.x);if(navigator.vibrate)try{navigator.vibrate(70);}catch(e){}}
function girlRun(dt){girl.pos.x-=girl.speed*dt;girl.phase+=girl.speed*dt*2.3/girl.scale;pose(girl.char,girl.phase,clamp(girl.speed/5,.5,1.1),0,0.15);girl.char.g.position.copy(girl.pos);}
function decoyRun(dt){if(!decoy.active||decoy.hit)return;decoy.pos.addScaledVector(decoy.dir,decoy.speed*dt);decoy.phase+=decoy.speed*dt*2.3;
  if(decoy.bike){const b=decoy.bike;b.g.position.copy(decoy.pos);b.wheels.forEach(w=>w.rotation.x+=decoy.speed*dt/0.34);riderPose(b.rider,decoy.phase*0.6);}
  else{pose(decoy.char,decoy.phase,1,0,0.2);decoy.char.g.position.copy(decoy.pos);}
  if(decoy.bellT>0)decoy.bellT-=dt;}
function updatePlay(dt){
  if(input.dash)player.speed=Math.min(11,player.speed+7.5*dt);
  else if(input.brake)player.speed=Math.max(0,player.speed-11*dt);
  else player.speed+=clamp(3-player.speed,-3.5*dt,2.5*dt);
  const st=(input.left?1:0)-(input.right?1:0);
  player.yaw=clamp(player.yaw+st*1.4*dt,-1.05,1.05);
  const prev=player.pos.clone();
  player.pos.x+=Math.sin(player.yaw)*player.speed*dt;player.pos.z+=Math.cos(player.yaw)*player.speed*dt;
  clampRoad(player.pos,prev,3.2-0.45);
  for(const ob of obstacles){if(!ob.active)continue;const dx=player.pos.x-ob.x,dz=player.pos.z-ob.z,dd=Math.hypot(dx,dz),rr=ob.r+0.42;
    if(dd<rr){if(player.speed>2.2){crashInto(ob);return;}const k=rr/(dd||1);player.pos.x=ob.x+dx*k;player.pos.z=ob.z+dz*k;player.speed*=0.9;}}
  player.phase+=player.speed*dt*2.3;
  pose(player.char,player.phase,clamp(player.speed/5,0.2,1.1),0,0.04+0.2*clamp(player.speed/11,0,1));
  player.char.g.position.copy(player.pos);player.char.g.rotation.y=player.yaw;
  girlRun(dt);decoyRun(dt);
  if(decoy.active&&!decoy.hit){
    if(decoy.who==='bike'&&!decoy.rang&&decoy.pos.distanceTo(player.pos)<22){decoy.rang=true;decoy.bellT=1.8;bell();}
    const dx=decoy.pos.x-player.pos.x,dz=decoy.pos.z-player.pos.z,rr=decoy.rad+0.42;
    if(dx*dx+dz*dz<rr*rr){wrongHit(dx,dz);return;}
  }
  const dx=girl.pos.x-player.pos.x,dz=girl.pos.z-player.pos.z,rr=0.36*girl.scale+0.4;
  if(dx*dx+dz*dz<rr*rr){impact(dx,dz);return;}
  if((girl.pos.x<player.pos.x-2.5&&girl.pos.x<-2.5)||(player.pos.z>girl.pos.z+3.5&&player.pos.z>3.5)||S.t>S.arrive+7)miss();
}
function impact(dx,dz){
  const len=Math.hypot(dx,dz)||1,n=V(dx/len,0,dz/len);
  const vP=heading().multiplyScalar(player.speed),vG=V(-girl.speed,0,0);
  const pn=Math.max(0,vP.dot(n))+0.35*Math.max(0,-vG.dot(n));

function envCollide(o,prev,rad,hs){
  let hit=null;const p=o.pos;
  if(p.y<1.85&&inRoad(prev.x,prev.z,3.2-rad)&&!inRoad(p.x,p.z,3.2-rad)){const ax=clampRoad(p,prev,3.2-rad);if(ax==='x')o.vel.x*=-0.3;else o.vel.z*=-0.3;if(hs>4)hit='ブロック塀';}
  for(const ob of obstacles){if(!ob.active||p.y>ob.h)continue;const dx=p.x-ob.x,dz=p.z-ob.z,dd=Math.hypot(dx,dz),rr=ob.r+rad;
    if(dd<rr&&dd>1e-4){const nx=dx/dd,nz=dz/dd;p.x=ob.x+nx*rr;p.z=ob.z+nz*rr;const vn=o.vel.x*nx+o.vel.z*nz;if(vn<0){o.vel.x-=1.4*vn*nx;o.vel.z-=1.4*vn*nz;}if(-vn>2.5){hit=ob.name;ob.wob=1.2;}}}
  for(const h of houses){if(p.y>h.h)continue;const dx=p.x-h.x,dz=p.z-h.z,px=h.hw+rad-Math.abs(dx),pz=h.hd+rad-Math.abs(dz);

  if(hit)gon();

}

  requestAnimationFrame(frame);

  const rdt=Math.min(0.05,(now-last)/1000);last=now;S.real+=rdt;
  if(S.state==='result'&&S.sb)sayTick(rdt);

let musicOut=null,musicBus=null;
function stopMusic(){if(musicOut&&AC){const t=AC.currentTime;musicOut.gain.cancelScheduledValues(t);musicOut.gain.setValueAtTime(musicOut.gain.value,t);musicOut.gain.linearRampToValueAtTime(0.0001,t+0.8);}musicOut=null;musicBus=null;}

  const g2=a.createGain();g2.gain.value=0.25;g2.connect(g);const o2=a.createOscillator();o2.type='sine';o2.frequency.value=f*2.002;o2.connect(g2);
  o1.start(t);o2.start(t);o1.stop(t+d+0.05);o2.stop(t+d+0.05);}

  musicOut=a.createGain();musicOut.gain.value=0.9;musicOut.connect(a.destination);
  musicBus=a.createGain();musicBus.gain.value=1;musicBus.connect(musicOut);
  const dl=a.createDelay();dl.delayTime.value=0.37;const fb=a.createGain();fb.gain.value=0.38;const wet=a.createGain();wet.gain.value=0.4;
  musicBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(musicOut);
  const Am=[57,69,72,76],F=[53,65,69,72],C=[48,64,67,72],G=[55,67,71,74],Em=[52,64,67,71];
  const song=which==='open'
    ?{step:0.3,chords:[Am,F,C,G,Am,F,C,G],mel:[null,null,null,null,[76,81],[77,76],[79,76],[74,71]]}
    :{step:0.34,chords:[F,G,Em,Am,F,G,C,C,F,G,Em,Am],mel:[null,null,null,null,[72,77],[74,79],[76,72],[72,67],[77,81],[79,74],[76,72],[72,76]]};
  let t=a.currentTime+0.15;const st=song.step;
  song.chords.forEach((ch,ci)=>{piano(ch[0]-12,t,st*9,0.1);
    [1,2,3,2,1,2,3,2].forEach((k,i)=>piano(ch[k],t+i*st,st*3.2,0.045));
    const m=song.mel[ci];if(m)m.forEach((n,i)=>piano(n+12,t+i*st*4,st*5,0.07));
    t+=st*8;});
  const last=song.chords[song.chords.length-1];last.forEach(n=>piano(n,t,4.5,0.06));piano(last[0]-12,t,5,0.1);
}

// ---------- cinematic
const MORNING={bg:new THREE.Color(0xbfe3ff),fog:new THREE.Color(0xd8ebf6),sun:new THREE.Color(0xfff0d6),sky:new THREE.Color(0xe3f3ff)};
const DUSK={bg:new THREE.Color(0xf2a176),fog:new THREE.Color(0xf0bf98),sun:new THREE.Color(0xff9a52),sky:new THREE.Color(0xffc49a)};
function setSunset(k){skyMat.uniforms.top.value.set(0x6fa9dd).lerp(new THREE.Color(0xe2826a),k);skyMat.uniforms.bot.value.set(0xe4eef3).lerp(new THREE.Color(0xfbd2a4),k);scene.background.copy(MORNING.bg).lerp(DUSK.bg,k);scene.fog.color.copy(MORNING.fog).lerp(DUSK.fog,k);sun.color.copy(MORNING.sun).lerp(DUSK.sun,k);hemi.color.copy(MORNING.sky).lerp(DUSK.sky,k);sun.intensity=1.3-0.25*k;document.body.style.background='#'+scene.background.getHexString();}
function K(t,p,l){return{t,p:V(p[0],p[1],p[2]),l:V(l[0],l[1],l[2])};}
function camKeys(keys,t){let i=0;while(i<keys.length-2&&t>keys[i+1].t)i++;const a=keys[i],b=keys[i+1];const u=clamp((t-a.t)/(b.t-a.t),0,1),s=u*u*(3-2*u);return{p:a.p.clone().lerp(b.p,s),l:a.l.clone().lerp(b.l,s)};}
const OPEN_KEYS=[K(0,[16,24,-70],[0,2,-10]),K(6,[0,9,-42],[0,1.5,0]),K(11,[-2.4,1.4,-9],[1.2,2.4,3]),K(15.2,[0.4,1.55,-29.4],[0,1.3,-32]),K(20.5,[0,2.5,-37.2],[0,1.2,-26])];
const TITLE_CARD='<div class="ct-title">出会い頭クラッシュ！</div><div class="ct-sub">〜遅刻遅刻〜</div><div class="ct-cred">主演　あなた</div>';
const OPEN_TEXT=[{t:0.8,d:3,h:'あの春――'},{t:4.2,d:3.2,h:'僕たちは毎朝、全力で走っていた。'},{t:7.8,d:3.2,h:'パンをくわえて。遅刻を背負って。'},{t:11.4,d:3.4,h:'曲がり角の向こうに、<br>何が待っているかも知らずに。'},{t:15.4,d:4.6,card:true,h:TITLE_CARD}];
const END_KEYS=[K(0,[0,1.35,-1],[0,1.1,-6]),K(5,[0,1.4,3.5],[0,1.1,-0.5]),K(9,[2.7,1.7,5.5],[0,1.1,3.9]),K(14,[0,3.2,1],[0,1.5,16]),K(22,[0,9,4],[0,11,80]),K(31.6,[0,20,-2],[0,22,90])];
S.cast=[];S.seen={};
function clearCast(){S.cast.forEach(c=>{if(c.ch!==player.char)scene.remove(c.ch.g);});S.cast=[];}
function beginCine(state,cine){S.state=state;S.cine=cine;S.cineT=0;S.cineAct=undefined;S.rollOn=false;S.impact=false;panel('');$('cskip').hidden=false;
  $('ctext').className='';$('roll').className='';$('roll').innerHTML='';document.body.classList.add('cine');}
function startOpening(){S.day=0;S.scores=[];S.seen={};S.freezeCam=false;setSunset(0);clearCast();setupRound();beginCine('opening',{keys:OPEN_KEYS,text:OPEN_TEXT,end:20.5});startMusic('open');}
function startEnding(){
  const total=S.scores.reduce((a,b)=>a+b.score,0),avg=total/Math.max(1,S.scores.length);
  scene.remove(girl.char.g);if(girl.char.toast.parent===scene)scene.remove(girl.char.toast);
  if(decoy.char)scene.remove(decoy.char.g);if(decoy.bike)scene.remove(decoy.bike.g);decoy.active=false;
  resetChar(player);player.char.g.rotation.set(0,0,0);
  clearCast();
  const xs=[-2.5,-1.5,-0.5,0.5,1.5,2.5];let gi=0;
  xs.forEach((x,i)=>{let ch;if(i===2)ch=player.char;else{ch=makeStudent(Object.assign({girl:true},TYPES[gi++]));}S.cast.push({ch,x,z:-6-(i%2)*0.5,ph:rand(0,6)});});
  const line=avg>=75?'ぶつかって、転んで、<br>それでも僕らは笑っていた。':avg>=50?'うまくいった朝も、<br>そうじゃない朝もあった。':'空回りの毎日。<br>それでも、明日もまた走る。';
  const sp=[];if(S.seen.bike)sp.push('自転車の人');if(S.seen.boy)sp.push('パンをくわえた男子学生');
  const roll='<p class="role">主演</p><p class="nm">あなた</p>'+
    '<p class="role">共演</p><p class="nm">'+TYPES.map(t=>t.name).join('<br>')+'</p>'+
    (sp.length?'<p class="role">特別出演</p><p class="nm">'+sp.join('<br>')+'</p>':'')+
    '<p class="role">審査</p><p class="nm">監督<br>助監督<br>アシスタント</p>'+
    '<p class="role">小道具</p><p class="nm">食パン 5枚</p>'+
    '<p class="role">撮影協力</p><p class="nm">カーブミラー<br>電柱のみなさん<br>赤いポスト<br>角の自販機</p>'+
    '<p class="role">総合得点</p><p class="nm">'+total+' / 500　ランク '+rankOf(avg)+'</p>';
  beginCine('ending',{keys:END_KEYS,end:31.6,roll:15.4,rollHtml:roll,text:[
    {t:2,d:3.6,h:'5日間の朝が、終わった。'},{t:6.4,d:3.8,h:line},{t:10.8,d:4,h:'――それが、僕たちの青春だった。'},
    {t:27.6,d:3.8,card:true,h:'<div class="ct-fin">FIN</div>'}]});
  startMusic('end');
}
function finishCine(){
  const st=S.state;document.body.classList.remove('cine');$('ctext').className='';$('roll').className='';stopMusic();$('cskip').hidden=true;
  if(st==='opening')toIntro();
  else{const k=camKeys(S.cine.keys,S.cine.end);camera.position.copy(k.p);camera.lookAt(k.l);setSunset(1);S.freezeCam=true;toFinal();}
}
function updateCine(rdt){
  S.cineT+=rdt;const t=S.cineT,C=S.cine;
  let act=null;for(const it of C.text){if(t>=it.t&&t<it.t+it.d){act=it;break;}}
  if(act!==S.cineAct){S.cineAct=act;const el=$('ctext');
    if(act){el.innerHTML=act.h;el.className=(act.card?'card':'');void el.offsetWidth;el.classList.add('on');}
    else el.classList.remove('on');}
  const k=camKeys(C.keys,t);camPos.copy(k.p);camLook.copy(k.l);camera.position.copy(k.p);camera.lookAt(k.l);
  if(S.state==='ending'){setSunset(clamp(t/5,0,1));
    for(const c of S.cast){c.z+=1.1*rdt;c.ph+=rdt*4.2;pose(c.ch,c.ph,0.42,0,0.04);c.ch.g.position.set(c.x,0,c.z);c.ch.g.rotation.set(0,0,0);}}
  else{pose(player.char,0,0,0,0);player.char.up.rotation.x=Math.sin(S.real*1.6)*0.02;}
  if(C.roll&&!S.rollOn&&t>=C.roll){S.rollOn=true;$('roll').innerHTML='<div class="in">'+C.rollHtml+'</div>';$('roll').className='run';}
  if(t>=C.end)finishCine();
}
$('cskip').addEventListener('click',()=>{if(S.state==='opening'||S.state==='ending')finishCine();});

// ---------- replay commentary
const AVS={'監督':'🎬','助監督':'📋','アシスタント':'🎧'};
function buildSay(r){
  const k=r.kind,kmh=r.kmh||Math.round(player.speed*3.6),obj=r.obj||'',L=[];
  L.push({rel:-3.1,w:'監督',s:(r.decoy||k==='wrong')&&Math.random()<0.5?'……台本にない足音だ。':pick(MUR['監督'])});
  L.push({rel:-2.3,w:'アシスタント',s:pick(MUR['アシスタント'])});
  L.push({rel:-1.7,w:'助監督',s:pick(MUR['助監督'])});
  L.push({rel:-0.75,w:'助監督',s:{great:'時速'+kmh+'km。想定どおり。',strong:'時速'+kmh+'km。やや速い。',fly:'時速'+kmh+'km。記録的です。',weak:'時速'+kmh+'km。散歩です。',ambush:'主演、停止中です。',crash:'前方に'+obj+'です。',wrong:r.who==='bike'?'台本にないベルです。':'学ラン、キャスト外です。',miss:'……ズレてますね。'}[k]});
  L.push({rel:-0.05,w:'監督',s:{great:'……ここだ。',strong:'……少し強い。',fly:'……ああ。',weak:'……今、触れたか？',ambush:'……待つな。',crash:'……'+obj+'か。',wrong:'……誰だ。',miss:'……出会わないのか。'}[k]});
  L.push({rel:0.75,w:'アシスタント',s:k==='fly'?(r.glance?'……まだ回ってます。':'まだ飛んでます。'):{great:T.caught?'パン、口に戻りました。':'お二人とも座り込みました。',strong:'パン、拾ってきます。',weak:'パン、口にあります。',ambush:'……気まずいです。',crash:obj+'、揺れてます。',wrong:r.who==='bike'?'卵、確認してきます。':'パンが2枚に。',miss:'何も起きてません。'}[k]});
  const J=judgeAll(r),ang=Math.round(r.ang||0);
  L.push({end:true,delay:0,w:'監督',s:k==='fly'?'カット。代役は、いるか？':k==='crash'?'カット。'+obj+'に罪はない。':k==='wrong'?'カット。彼にも物語がある。':k==='miss'?'カット。曇りにしよう。':J[0].s>=9?'カット。オープニングに使う。':'カット。朝からやろう。'});
  L.push({end:true,delay:0.8,w:'助監督',s:k==='great'?'テイク1、OKです。':['strong','fly','weak'].includes(k)?'角度'+ang+'度、記録しました。':k==='crash'?obj+'、無傷です。':k==='wrong'?'代役、相談します。':'テイク2、準備します。'});
  const avoided=r.decoy&&['great','strong','weak'].includes(k);
  L.push({end:true,delay:1.6,w:'アシスタント',s:avoided?(r.decoy==='bike'?'自転車の方に、お礼を……':'男子にも、パンを……'):{great:'パンさん、お疲れさまでした……',strong:'パンは、スタッフで……',fly:'新しいパン、持っていきます……',weak:'パン、まだ温かいです……',ambush:'パン、冷めました……',crash:obj+'さん、お疲れさまでした……',wrong:'パン、もう1枚焼きます……',miss:'……パン、冷めますね。'}[k]});
  return L;
}
const SBI={'監督':0,'助監督':1,'アシスタント':2};
function sayShow(it){S.sb[it.w]={s:it.s,t:0};const b=$('sb'+SBI[it.w]);b.textContent='';b.classList.add('show');}
function sayTick(rdt){for(const w in S.sb){const o=S.sb[w];o.t+=rdt;const n=Math.max(0,Math.min(o.s.length,Math.floor(o.t*20))),el=$('sb'+SBI[w]);el.textContent=o.s.slice(0,n);el.classList.toggle('show',n>0);}}

toTitle();
